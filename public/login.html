<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cloudy — Sign in</title>
  <link rel="stylesheet" href="style.css">
  <style>
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
    }

    .login-wrap {
      width: 100%;
      max-width: 380px;
      text-align: center;
    }

    .login-mascot {
      margin-bottom: 20px;
    }

    .login-title {
      font-size: 14px;
      color: var(--primary);
      margin-bottom: 24px;
      letter-spacing: 2px;
    }

    .tab-row {
      display: flex;
      gap: 8px;
      margin-bottom: 20px;
    }

    .tab-row button {
      flex: 1;
    }

    .tab-row button.active {
      background: var(--primary);
      color: var(--white);
      border-color: var(--dark);
    }

    .form-group {
      margin-bottom: 14px;
      text-align: left;
    }

    .form-group label {
      display: block;
      font-size: 7px;
      color: var(--dark);
      margin-bottom: 6px;
    }

    .submit-btn {
      width: 100%;
      margin-top: 6px;
      font-size: 10px;
      padding: 14px;
    }

    #confirm-group { display: none; }
  </style>
</head>
<body>
  <div class="login-wrap">
    <div class="login-mascot">
      <img src="cloud1.png" alt="Cloudy" class="mascot" style="width:120px;height:120px;">
    </div>

    <p class="login-title">CLOUDY</p>

    <div class="card">
      <div class="tab-row">
        <button class="btn btn-light active" id="tab-login" onclick="showTab('login')">LOGIN</button>
        <button class="btn btn-light" id="tab-register" onclick="showTab('register')">REGISTER</button>
      </div>

      <div class="form-group">
        <label>USERNAME</label>
        <input type="text" id="username" placeholder="your name..." autocomplete="username">
      </div>

      <div class="form-group">
        <label>PASSWORD</label>
        <input type="password" id="password" placeholder="••••••••" autocomplete="current-password">
      </div>

      <div class="form-group" id="confirm-group">
        <label>CONFIRM PASSWORD</label>
        <input type="password" id="confirm" placeholder="••••••••" autocomplete="new-password">
      </div>

      <div class="error-msg" id="error-msg"></div>

      <button class="btn btn-primary submit-btn" id="submit-btn" onclick="handleSubmit()">
        LOGIN
      </button>
    </div>
  </div>

  <script>
    let mode = 'login';

    function showTab(t) {
      mode = t;
      document.getElementById('tab-login').classList.toggle('active', t === 'login');
      document.getElementById('tab-register').classList.toggle('active', t === 'register');
      document.getElementById('confirm-group').style.display = t === 'register' ? 'block' : 'none';
      document.getElementById('submit-btn').textContent = t === 'login' ? 'LOGIN' : 'REGISTER';
      document.getElementById('error-msg').textContent = '';
    }

    async function handleSubmit() {
      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value;
      const confirm  = document.getElementById('confirm').value;
      const errEl    = document.getElementById('error-msg');
      errEl.textContent = '';

      if (!username || !password) { errEl.textContent = 'Fill in all fields.'; return; }
      if (mode === 'register' && password !== confirm) { errEl.textContent = 'Passwords do not match.'; return; }

      const url = mode === 'login' ? '/api/auth/login' : '/api/auth/register';
      try {
        const res  = await fetch(url, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          credentials: 'include',
          body: JSON.stringify({ username, password }),
        });
        const data = await res.json();
        if (!res.ok) { errEl.textContent = data.error || 'Something went wrong.'; return; }
        window.location.href = '/index.html';
      } catch {
        errEl.textContent = 'Connection error.';
      }
    }

    // Allow Enter key
    document.addEventListener('keydown', e => { if (e.key === 'Enter') handleSubmit(); });

    // Redirect if already logged in
    fetch('/api/auth/me', { credentials: 'include' })
      .then(r => { if (r.ok) window.location.href = '/index.html'; });
  </script>
</body>
</html>
